services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      AUTO_SIGN_ENABLED: ${AUTO_SIGN_ENABLED:-true}
      TZ: Asia/Shanghai
      ICLASS_CAPTCHA_OCR_URL: ${ICLASS_CAPTCHA_OCR_URL-http://captcha-ocr:8000/ocr}
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:80"
    restart: unless-stopped

  captcha-ocr:
    build:
      context: ./ocr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
