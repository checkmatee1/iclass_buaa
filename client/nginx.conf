server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Browser requests stay on this site; local control services are not allowed destinations.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Entry HTML must always discover the current hashed JavaScript bundle.
    location = /index.html {
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
